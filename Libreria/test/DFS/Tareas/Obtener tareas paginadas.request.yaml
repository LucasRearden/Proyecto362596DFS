$kind: http-request
url: "{{base_url}}/tareas?pagina=1&limite=2&completed=false"
method: GET
queryParams:
  pagina: "1"
  limite: "2"
  completed: "false"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
