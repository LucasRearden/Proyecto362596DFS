$kind: http-request
url: "{{base_url}}/tareas"
method: POST
body:
  type: json
  content: |-
    {
        "title":"{{$randomLoremSentence}}",
        "completed":{{$randomBoolean}}
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      pm.collectionVariables.set("tareaId", response.tarea.id);
    language: text/javascript
order: 4000
